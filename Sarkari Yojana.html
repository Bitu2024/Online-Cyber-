<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkari Yojana</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
}

.header{
    width:100%;
}

.header img{
    width:100%;
    height:auto;
    display:block;
}

.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:90%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
}

.Sarkari-Yojana{
    width:90%;
    max-width:700px;
    margin:auto;
    background:white;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    padding:10px;
}

.Sarkari-Yojana ul{
    list-style:none;
    padding:0;
}

.Sarkari-Yojana li{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.Sarkari-Yojana li a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.Sarkari-Yojana li:hover{
    background:#eef7ff;
}
</style>

</head>

<body>

<header class="header">
    <img src="Header 1.png" alt="Online Cyber Header">
</header>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search Latest Sarkari Yojana...">
</div>

<div class="Sarkari-Yojana">
    <ul id="Sarkari Yojana">
        <li><a href="#">RRB JE Recruitment 2026</a></li>
        <li><a href="#">Railway Group D 2026</a></li>
        <li><a href="#">Bihar Police Vacancy</a></li>
        <li><a href="#">SSC GD Recruitment</a></li>
        <li><a href="#">Indian Army Rally</a></li>
        <li><a href="#">NFR Apprentice</a></li>
        <li><a href="#">Bank PO Vacancy</a></li>
    </ul>
</div>

<script>
let searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function () {

    let filter = this.value.toLowerCase();

    let li = document.querySelectorAll("#Sarkari Yojana");

    li.forEach(function(item) {

        let text = item.innerText.toLowerCase();

        if (text.indexOf(filter) > -1) {
            item.style.display = "";
        } else {
            item.style.display = "none";
        }

    });

});
</script>

</body>
</html>
