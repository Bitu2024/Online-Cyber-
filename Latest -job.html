<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Jobs</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
}

.header{
    width:100%;
}

.header img{
    width:100%;
    height:auto;
    display:block;
}

/*header{
    background:#45a4ff;
    color:white;
    text-align:center;
    padding:15px;
}

header h1{
    margin:0;
}
*/

/* Navigation */
.navbar{
    background:#d50000;
}

.navbar ul{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    list-style:none;
}

.navbar ul li{
    border-right:1px solid #fff;
}

.navbar ul li:last-child{
    border-right:none;
}

.navbar ul li a{
    display:block;
    padding:15px 20px;
    text-decoration:none;
    color:#fff;
    font-weight:bold;
    transition:0.3s;
}

.navbar ul li a:hover{
    background:#0d6efd;
}

.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:90%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
}

.search-box input:focus{
    border-color:#45A4FF;
    outline:none;
}

.job-list{
    width:90%;
    max-width:700px;
    margin:auto;
    background:white;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    padding:10px;
}

.job-list ul{
    list-style:none;
    padding:0;
}

.job-list li{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.job-list li a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.job-list li a:hover{
    color:#45A4FF;
}

.job-list li:hover{
    background:#eef7ff;
}
</style>

</head>

<body>

<header class="header">
    <img src="Header 1.png" alt="Online Cyber Header">
</header>

<!-- Navbar --> 

<nav class="navbar">  
    <ul>  
<li><a href="#">🏠Home</a></li>  
<li><a href="Latest -job">🚀Latest Jobs</a></li>  
<li><a href="Admit Card">📄Admit Card</a></li>  
<li><a href="Results">🏆Results</a></li>  
<li><a href="University">🏫University</a></li>  
<li><a href="Sarkari Yojana">🏛️Sarkari Yojana</a></li>  
<li><a href="Scholarship">🧑‍🎓Scholarship</a></li>  
    </ul>  
</nav>  

<!--header>
    <h1>Online Cyber 📌Latest Jobs</h1>
</header-->

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search Latest Jobs...">
</div>

<div class="job-list">
    <ul id="jobList">
        <li><a href="#">RRB JE Recruitment 2026</a></li>
        <li><a href="#">Railway Group D 2026</a></li>
        <li><a href="#">Bihar Police Vacancy</a></li>
        <li><a href="#">SSC GD Recruitment</a></li>
        <li><a href="#">Indian Army Rally</a></li>
        <li><a href="#">NFR Apprentice</a></li>
        <li><a href="#">Bank PO Vacancy</a></li>
    </ul>
</div>

<script>
let searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function () {

    let filter = this.value.toLowerCase();

    let li = document.querySelectorAll("#jobList li");

    li.forEach(function(item) {

        let text = item.innerText.toLowerCase();

        if (text.indexOf(filter) > -1) {
            item.style.display = "";
        } else {
            item.style.display = "none";
        }

    });

});
</script>

</body>
</html>
