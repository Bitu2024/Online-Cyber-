<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admit Card</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
}

.header{
    width:100%;
}

.header img{
    width:100%;
    height:auto;
    display:block;
}

/*header{
    background:#45A4FF;
    color:white;
    text-align:center;
    padding:15px;
}*/

.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:90%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
    outline:none;
}

.search-box input:focus{
    border-color:#45A4FF;
}

.job-list{
    width:90%;
    max-width:700px;
    margin:auto;
    background:white;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    padding:10px;
}

.job-list ul{
    list-style:none;
    padding:0;
    margin:0;
}

.job-list li{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.job-list li:last-child{
    border-bottom:none;
}

.job-list li a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
    display:block;
}

.job-list li:hover{
    background:#EEF7FF;
}
</style>

</head>

<body>

<header class="header">
    <img src="Header 1.png" alt="Online Cyber Header">
</header>

<!--header>
    <h1>📄 Admit Card</h1>
</header-->

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search Admit Card...">
</div>

<div class="job-list">
    <ul id="admitcard">
        <li><a href="#">BSEB Dummy Card</a></li>
        <li><a href="#">RRB Exam City</a></li>
        <li><a href="#">High Court Admit Card</a></li>
        <li><a href="#">Police SI Admit Card</a></li>
        <li><a href="#">Polytechnic Admit Card</a></li>
    </ul>
</div>

<script>
let searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function () {

    let filter = this.value.toLowerCase();

    let li = document.querySelectorAll("#admitcard li");

    li.forEach(function(item) {

        let text = item.innerText.toLowerCase();

        if (text.indexOf(filter) > -1) {
            item.style.display = "";
        } else {
            item.style.display = "none";
        }

    });

});
</script>

</body>
</html>
