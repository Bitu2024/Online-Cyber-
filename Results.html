<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    margin:0;
}

.header{
    width:100%;
}

.header img{
    width:100%;
    height:auto;
    display:block;
}

/* Navbar */
.navbar{
    background:#d50000;
}

.navbar ul{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    list-style:none;
    margin:0;
    padding:0;
}

.navbar ul li{
    border-right:1px solid #fff;
}

.navbar ul li:last-child{
    border-right:none;
}

.navbar ul li a{
    display:block;
    padding:15px 20px;
    text-decoration:none;
    color:#fff;
    font-weight:bold;
    transition:.3s;
}

.navbar ul li a:hover{
    background:#0d6efd;
}

/* Search Box */
.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:90%;
    max-width:700px;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
}

.search-box input:focus{
    border-color:#45A4FF;
    outline:none;
}

/* Title */
.title{
    width:90%;
    max-width:1000px;
    margin:auto;
    background:red;
    color:#fff;
    text-align:center;
    font-size:38px;
    font-weight:bold;
    padding:15px;
    box-sizing:border-box;
}

/* Result List */
.job-list{
    width:90%;
    max-width:1000px;
    margin:0 auto 20px;
    background:#fff;
    border:1px solid #45A4FF;
}

.job-list ul{
    list-style:none;
    margin:0;
    padding:0;
}

.job-list li{
    border-bottom:1px solid #45A4FF;
}

.job-list li:last-child{
    border-bottom:none;
}

.job-list li a{
    display:block;
    padding:18px;
    text-decoration:none;
    color:#000;
    font-size:22px;
    font-weight:bold;
    line-height:1.5;
}

.job-list li a:hover{
    background:#eef7ff;
    color:#1976d2;
}
</style>

</head>

<body>

<header class="header">
    <img src="Header 1.png" alt="Online Cyber Header">
</header>

<nav class="navbar">
<ul>
<li><a href="index.html">🏠 Home</a></li>
<li><a href="latest-job.html">🚀 Latest Jobs</a></li>
<li><a href="Admit Card.html">📄 Admit Card</a></li>
<li><a href="Results.html">🏆 Results</a></li>
<li><a href="University.html">🏫 University</a></li>
<li><a href="Sarkari Yojana.html">🏛️ Sarkari Yojana</a></li>
<li><a href="Scholarship.html">🧑‍🎓 Scholarship</a></li>
</ul>
</nav>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search Latest Result...">
</div>

<div class="title">
Results
</div>

<div class="job-list">
<ul id="Result">
<li><a href="#">RRB Group D Result</a></li>
<li><a href="#">Polytechnic Result</a></li>
<li><a href="#">DELED Result</a></li>
<li><a href="#">B.Ed Merit List</a></li>
<li><a href="#">University Result</a></li>
</ul>
</div>

<script>
let searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function(){

    let filter = this.value.toLowerCase();
    let li = document.querySelectorAll("#Result li");

    li.forEach(function(item){

        let text = item.innerText.toLowerCase();

        if(text.indexOf(filter) > -1){
            item.style.display = "";
        }else{
            item.style.display = "none";
        }

    });

});
</script>

</body>
</html>
