<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
}

.header{
    width:100%;
}

.header img{
    width:100%;
    height:auto;
    display:block;
}


.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:90%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
}

.Result{
    width:90%;
    max-width:700px;
    margin:auto;
    background:white;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    padding:10px;
}

.Result ul{
    list-style:none;
    padding:0;
}

.Result li{
    padding:12px;
    border-bottom:1px solid #ddd;
}

.Result li a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.Result li:hover{
    background:#eef7ff;
}
</style>

</head>

<body>

<header class="header">
    <img src="Header 1.png" alt="Online Cyber Header">
</header>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search Lastest Result...">
</div>

<div class="Result">
    <ul id="Result">
        <li><a href="#">RRB Group D Result</a></li>
        <li><a href="#">Polytechnic Result</a></li>
        <li><a href="#">DELED Result</a></li>
        <li><a href="#">Bed Merit List</a></li>
        <li><a href="#">University Result</a></li>
    </ul>
</div>

<script>
let searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function () {

    let filter = this.value.toLowerCase();

    let li = document.querySelectorAll("#result li");

    li.forEach(function(item) {

        let text = item.innerText.toLowerCase();

        if (text.indexOf(filter) > -1) {
            item.style.display = "";
        } else {
            item.style.display = "none";
        }

    });

});
</script>

</body>
</html>
